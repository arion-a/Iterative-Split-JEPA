experiment: "E45 (the whitening scale fixed, the E44 case re-run at 4 and 5 blocks, generic MLP)"
depths: {4: results/minimal/e45/d4, 5: results/minimal/e45/d5}
seeds: [160, 161, 162, 163, 164, 165, 166, 167, 168, 169]
thresholds: {angle_max_deg: 5.0, gap_min: 10.0, presence_min: 0.95, health_min_eig: 0.5}
rung_line: "at each depth every rung has angle under 5 and gap over 10 on at least 7 of 10 seeds (the E44 level)"
health_line: "at each depth every eigenvalue of the encoder's output covariance is at least 0.5 (no dead direction) on at least 9 of 10 seeds"
core_line: "at each depth the last (slowest) block has presence at least 0.95 on at least 7 of 10 seeds"
verdict: "confirmed if all three lines hold at both depths, otherwise refuted with the failing line named; no tuning"
weight_rule: "per depth, one weight W for both whitening terms: the smallest of {1, 10} whose pilot encoder (seed 0, 10,000 steps) has every output-covariance eigenvalue at least 0.5; presence is not consulted; if neither is healthy at a depth, that depth is not run and that is the result"
references: {e44_before_fix: results/minimal/e44}
