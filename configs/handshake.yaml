# Stage V — video-first handshake (docs/IMPLEMENTATION_PLAN.md). `criteria` is FROZEN: experiments refuse to run
# if its sha256 differs from configs/handshake.criteria.sha256. Everything outside `criteria` is recipe.
stage: V
plan_ref: "docs/IMPLEMENTATION_PLAN.md P1-P3; MATHEMATICAL_PLAN revised handshake (E31c', E31d, E31e); D13-D17"

criteria:
  pilot:
    stability_min_abs_spearman: 0.9      # P-stab: psi agreement between seeds, held-out test frames
    control_max_abs_spearman_E: 0.9      # P-ctrl: flat and shuffled arms must stay below (evaluator side)
  certificate:                           # E31c' (D15, D16)
    V_max: 0.05
    icc_min: 0.9
    L_max: 1.02
    rollout_nmse_max: 0.35               # rollout RMSE / std(psi) at K frames
    horizon_K: 8
    delta_std: 0.1
    n_pairs: 200
  naming:                                # E31d (D14)
    spearman_min: 0.99
  ladder:                                # E31e
    gamma_min: 2.0
    s1_rung: 3
    lags: [8, 32]                        # temporal rungs 2 and 3 (rung 1 = nuisance, augmentation pairs)
    s1_chance_fraction: 0.05             # S1: lambda_max of the family's moment <= 5% of an unmatched pair's energy (2 per whitened dim)
    b2_quantile: 0.99                    # B^2 in c(n) estimated as the 99th percentile of squared pair differences (DECIDE 12)

seeds: [0, 1, 2]

world:
  n_releases: 150
  splits: [100, 25, 25]
  n_frames: 200
  dt_frame: 0.05
  dt_int: 0.001
  size: 32
  amp_range: [0.3, 3.14159]
  omega_std: 0.3
  nuisance_amp: 0.4          # additive illumination pattern, 4 coefficients ~ U(-amp, amp) per rendering
  pixel_noise: 0.01

encoder:
  latent_dim: 64              # dev diagnostic (seed 100, ladder cliff only): 12/32-d latents expose no clean temporal cut
  hidden: 256
  steps: 4000
  batch_size: 256
  lr: 3.0e-3
  horizons: [1, 8, 32]
  var_weight: 1.0e-2
  cov_weight: 0.04
  zca_eps: 1.0e-5
  aug_weight: 0.2             # consistency between two renderings of a frame (LIVE_DATA_PLAN §2); 0 leaves nuisance with no cliff (dev)
