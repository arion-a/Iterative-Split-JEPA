# E23 (docs/EVIDENCE.md): the B1 ladder with a generic MLP encoder (Stage A recipe) instead of the mirror encoder; criteria block identical to configs/stage_b1.yaml.
# Stage B1 — mechanism: given CORRECT matched pairs at each level, can the invariant block of one
# split be split again?  (plan §4.2; design: docs/stage_b1_design.md; approved with two additions)
# Paper-faithful: Gaussian hidden numbers, the paper's coupling map with no extra observed numbers,
# mirror-style encoder + the paper's objective. Pairs are ground-truth (generator-made) at each level.
# `criteria` is hash-frozen (stage_b1.criteria.sha256). Every B1 result is labelled "ground-truth pairs".
stage: B1
plan_ref: "experimental_plan §4.2; log entry 'Plan amendment: Stage B split into B1/B2'"

world:
  block_dims: [4, 4, 4]          # texture (fast), identity, category (slow)
  rhos: [0.2, 0.7, 0.95]         # separated speeds; the fast-block squash risk is kept visible on purpose
  coupling_layers: 4
  coupling_strength: 0.5
  obs_dim: 16                    # E23: 16 observed numbers (lifted), as in Stage A

encoder:
  arch: mlp                      # E23: generic (non-mirror) encoder, the Stage A recipe
  corr_var_weight: 0.0           # E42's std hinge is replaced by the whitened version below
  corr_whiten_weight: 1.0  # E43: whitening constraint (Lemma 3.1) enforced on all outputs and on each family's own block, one weight, picked by the health rule on a pilot
  corr_inv_weight: 1.0           # E40 treated arm: the theory's invariance term, fixed, never tuned
  objective: predict             # predictor + regulariser (not the paper's alignment objective)
  steps: 30000      # E43: three times longer than E40/E42
  batch_size: 256
  lr: 3.0e-3
  hidden: 64                     # MLP obs -> 64 -> 64 -> d, GELU
  reg: hinge
  var_weight: 1.0e-2
  cov_weight: 0.04
  stop_grad: true
  sigreg_weight: 1.0e-6          # unused by this objective (kept so the shared code path has it)

split:
  d_ks: [4, 4]                   # rung 1 splits off texture, rung 2 splits off identity; category is the core
  num_whiten: 30000
  zca_eps: 1.0e-5
  num_pairs: 30000               # per rung
  probe_train: 15000
  probe_test: 5000

significance:
  alpha: 0.01                    # permutation null, Holm correction; strict, no tolerance floor
  n_perm: 20
  rank_test_delta: 0.01

rung_gate: true
seeds: [0, 1, 2]

criteria:                        # every line must hold on every seed
  rung_angle_max_deg: 5.0        # each rung's variant block vs the true block (probe-recovered), rungs 1 and 2
  variant_r2_min: 0.9            # true block read from the rung's variant block: rung 1 (texture), rung 2 (identity)
  core_invariant_r2_min: 0.9     # ADDED: category read from the last 4 directions (the rung-2 leftover) vs ground truth
  nesting_angle_max_deg: 5.0     # rung-2 variant block lies inside the true span of identity + category
  gap_ratio_min: 10.0            # at each rung
  leakage: "no significant off-diagonal at the permutation null (Holm, alpha 0.01), each rung; strict"
  rank_test: "smallest eigenvalue of the variant block's pair-difference moment is above the monograph's rank-deficiency bound B^2*sqrt(2 log(1/delta)/n), delta 0.01, at each rung"
  located_risk_rule: "ADDED: if the ONLY criterion that fails (on any seed) is rung-1 variant_r2 (texture), the verdict is PASS_WITH_LOCATED_RISK and it is logged as the located risk (separate speeds + the paper's alignment objective squash the fast block), not as a B1 failure. Any other failure is FAIL."

controls:                        # judged on the MEAN over seeds
  must_fail:
    shuffled_rung2: {rung2_angle_min_deg: 45.0, rung2_gap_ratio_max: 2.0}
    rank1_rung2:    {rung2_angle_min_deg: 10.0, rung1_angle_max_deg: 5.0}
  recorded_no_expectation: [no_inv, no_pred, no_var]   # no spectral head scored 0.96 in Stage A with this encoder
