# Stage B — the core claim: can the invariant output of rung 1 be split again? (plan §4.2, §6)
# Paper-faithful: Gaussian hidden numbers, the paper's coupling map with no extra observed numbers,
# mirror-style encoder + the paper's objective (alignment + SIGReg), matched pairs made by sharing
# the slower blocks (as the paper makes them). `criteria` is hash-frozen (stage_b.criteria.sha256).
stage: B
plan_ref: "experimental_plan §4.2; decision log entry 'follow the paper's methods for Stage B'"

world:
  block_dims: [4, 4, 4, 1]       # texture (fast), identity, category (slow), planted cross-cutting factor
  rhos: [0.2, 0.7, 0.95, 0.5]    # separated timescales; the factor is not part of the chain
  cross_block: 4                 # 1-based index of the cross-cutting block
  cross_p: 0.5                   # it varies in half of the pairs of EVERY family
  coupling_layers: 4
  coupling_strength: 0.5
  obs_dim: null                  # = number of hidden numbers (the paper's setting; no lift)

encoder:
  arch: inverse_coupling         # mirror-style, as in the paper's simulation
  objective: lejepa              # alignment + SIGReg, as in the paper
  steps: 10000
  batch_size: 256
  lr: 3.0e-3
  sigreg_weight: 1.0e-6
  hidden: 64
  reg: sigreg
  var_weight: 0.0

split:
  d_ks: [4, 4]                   # rung 1 splits off texture, rung 2 splits off identity; category (+ factor) is the core
  num_whiten: 30000
  zca_eps: 1.0e-5
  num_pairs: 30000               # per rung
  probe_train: 15000
  probe_test: 5000

significance:
  alpha: 0.01
  n_perm: 1000

seeds: [0, 1, 2]
null_seeds: [0, 1, 2]            # same pipeline on a world WITHOUT the cross-cutting factor

criteria:                        # all must hold on every seed
  rung_angle_max_deg: 5.0        # each rung's variant block vs the true block (probe-recovered), rungs 1 and 2
  nesting_angle_max_deg: 5.0     # rung-2 variant block must lie inside the true span of blocks 2, 3 and the factor
  deviation_direction_angle_max_deg: 5.0   # leftover direction at each rung vs the true factor
  deviation_recurrence_angle_max_deg: 5.0  # the same direction recurs at both rungs
  deviation_T_min: 0.5
  deviation_T_over_null_max: 3.0 # T must exceed 3x the largest T seen in the factor-free null worlds
  gate_G1_rung1_angle_max_deg: 5.0
  note_gap_ratio: "reported, not gating: the planted factor deliberately sits in the spectrum (gap about 2)"

controls:                        # must fail as stated (plan §4.2 controls); judged on the MEAN over seeds
  shuffled_rung2: {rung2_angle_min_deg: 45.0, rung2_gap_ratio_max: 1.3}   # amended before the registered runs (see log)
  rank1_rung2:    {rung2_angle_min_deg: 10.0, rung1_angle_max_deg: 5.0}
  no_pred:        {rung1_angle_min_deg: 5.0}
  no_inv:         {rung1_angle_min_deg: 5.0}
  no_var:         {note: "recorded, no hard expectation"}
