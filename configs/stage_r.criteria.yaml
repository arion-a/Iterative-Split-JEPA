experiment: "Stage R (robot images): E46 diagnostic and E47 robot-head test"
tasks: {PickCube: {fixed_d1: 64, pca: 128}, PushCube: {fixed_d1: 128, pca: 256}}
split_seeds: [0, 1, 2]
holdout_groups: 20
folders: {baseline: results/stage_r/baseline, treated: results/stage_r/treated}
E46: {dead_direction_if_eigenvalue_below: "0.01 x the mean eigenvalue of the head's output covariance", prediction: "a dead direction on at least 4 of the 6 baseline runs"}
E47: {head_terms: {inv_weight: 1.0, whiten_weight: 1.0}, pass: "per task, P1-P4 as registered for E24 hold on all 3 split seeds", P1: "viewpoint response V1/Q1 at least 3", P2: "trajectory response V2/Q2 at least 1.5", P3: "shuffled-pair rung-1 gap ratio under 2 and both random-split ratios under 1.5", P4: "camera accuracy at least 0.9 from V1 and at most 0.65 from Q1"}
reported_not_judged: "held-out-scene P1 ratio, layout and progress R2 from the core and from all features on the 20 held-out groups; rung-1 gap ratio; head output rank"
