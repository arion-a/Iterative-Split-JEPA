experiment: E43 (whitening constraint enforced, longer training, generic MLP)
folder: results/minimal/e43
seeds: [140, 141, 142, 143, 144, 145, 146, 147, 148, 149]
min_seeds: 9
thresholds: {angle_max_deg: 5.0, gap_min: 10.0, presence_min: 0.95}
pass: "presence at least 0.95 for all three blocks and both rungs with angle under 5 and gap over 10, on at least 9 of 10 seeds"
weight_rule: "one weight W for both whitening terms, the smallest of {1, 10} for which the pilot encoder (seed 0, 10,000 steps) has every eigenvalue of its output covariance at least 0.5 (no dead dimension); presence is not consulted. If neither is healthy, E43 is not run and that is the result."
steps: 30000
references: {e40_baseline: results/minimal/e40/baseline, e40_invariance_only: results/minimal/e40/treated, e42_variance_hinge: results/minimal/e42}
