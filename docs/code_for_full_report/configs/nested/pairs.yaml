# E58: identity (untrained) encoder on purpose, to isolate pair construction from encoder learning (E54 controls: identity matches trained at strength 0.5); sigma 0.15 so that same-cluster pairs add little noise in slower blocks (2 sigma^2 = 0.045).
completeness: true
controls:
  must_fail:
    rank1_rung2:
      rung1_angle_max_deg: 5.0
      rung2_angle_min_deg: 10.0
    shuffled_rung2:
      rung2_angle_min_deg: 45.0
      rung2_gap_ratio_max: 2.0
  recorded_no_expectation:
  - no_inv
  - no_pred
  - no_var
criteria:
  core_invariant_r2_min: 0.9
  gap_ratio_min: 10.0
  leakage: no significant off-diagonal at the permutation null (Holm, alpha 0.01),
    each rung; strict
  located_risk_rule: 'ADDED: if the ONLY criterion that fails (on any seed) is rung-1
    variant_r2 (texture), the verdict is PASS_WITH_LOCATED_RISK and it is logged as
    the located risk (separate speeds + the paper''s alignment objective squash the
    fast block), not as a B1 failure. Any other failure is FAIL.'
  nesting_angle_max_deg: 5.0
  rank_test: smallest eigenvalue of the variant block's pair-difference moment is
    above the monograph's rank-deficiency bound B^2*sqrt(2 log(1/delta)/n), delta
    0.01, at each rung
  rung_angle_max_deg: 5.0
  variant_r2_min: 0.9
encoder:
  arch: coupling_mlp
  batch_size: 256
  enc_layers: 6
  hidden: 64
  lr: 0.0
  objective: lejepa
  reg: sigreg
  sigreg_weight: 1.0e-06
  steps: 1
  var_weight: 0.0
nested:
  cluster_samples: 15000
  counts:
  - 2
  - 2
  - 2
  - 2
  - 2
  - 6
  kmeans_restarts: 5
  sigma: 0.15
plan_ref: "experimental_plan \xA74.2; log entry 'Plan amendment: Stage B split into\
  \ B1/B2'"
rung_gate: false
seeds:
- 0
- 1
- 2
significance:
  alpha: 0.01
  n_perm: 20
  rank_test_delta: 0.01
split:
  d_ks:
  - 4
  - 4
  - 4
  - 4
  - 4
  num_pairs: 30000
  num_whiten: 30000
  probe_test: 5000
  probe_train: 15000
  zca_eps: 1.0e-05
stage: B1
world:
  block_dims:
  - 4
  - 4
  - 4
  - 4
  - 4
  - 4
  coupling_layers: 4
  coupling_strength: 0.5
  obs_dim: 16
  rhos:
  - 0.2
  - 0.4
  - 0.6
  - 0.75
  - 0.88
  - 0.95
