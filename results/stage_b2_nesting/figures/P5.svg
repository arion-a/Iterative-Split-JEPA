<svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 720 250" role="img" aria-label="Ladder: nested blocks, angles" class="chart"><rect width="100%" height="100%" fill="#fcfcfb"/><style>.grid{stroke:#e1e0d9;stroke-width:1}.axis{stroke:#c3c2b7;stroke-width:1}.limit{stroke:#52514e;stroke-width:1}.tick{fill:#898781;font:11.5px system-ui,sans-serif}.lab{fill:#52514e;font:12.5px system-ui,sans-serif}.val{fill:#0b0b0b;font:600 12.5px system-ui,sans-serif}.dot{stroke:#fcfcfb;stroke-width:2}</style><rect x="60" y="50" width="190" height="70" rx="4" style="fill:#2a78d6;fill-opacity:.16;stroke:#2a78d6" stroke-width="2"/><text x="155" y="78" class="val" text-anchor="middle">Rung 1 variant</text><text x="155" y="96" class="lab" text-anchor="middle">texture (4 directions)</text><text x="155" y="114" class="tick" text-anchor="middle">angle B1 3.8°  B2 3.8°</text><rect x="270" y="50" width="190" height="70" rx="4" style="fill:#eb6834;fill-opacity:.16;stroke:#eb6834" stroke-width="2"/><text x="365" y="78" class="val" text-anchor="middle">Rung 2 variant</text><text x="365" y="96" class="lab" text-anchor="middle">identity (4 directions)</text><text x="365" y="114" class="tick" text-anchor="middle">angle B1 11.6°  B2 11.7°</text><rect x="480" y="50" width="190" height="70" rx="4" style="fill:#1baf7a;fill-opacity:.16;stroke:#1baf7a" stroke-width="2"/><text x="575" y="78" class="val" text-anchor="middle">Invariant core</text><text x="575" y="96" class="lab" text-anchor="middle">category (4 directions)</text><text x="575" y="114" class="tick" text-anchor="middle">R² B1 0.965  B2 0.965</text><line x1="270" x2="670" y1="150" y2="150" class="axis"/><text x="270" y="168" class="lab">kept by rung 1: 8 directions (identity + category)</text><line x1="480" x2="670" y1="190" y2="190" class="axis"/><text x="480" y="208" class="lab">kept by rung 2: 4 directions (category)</text><text x="60" y="30" class="lab">12 directions in all. Limit: every angle below 5°.</text></svg>